services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: smartuser
      POSTGRES_PASSWORD: smartpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_vol:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d/
    networks:
      - smarthome-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smartuser -d smarthome" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: lokteevia@yandex.ru
      PGADMIN_DEFAULT_PASSWORD: 123
    ports:
      - "8888:80"
    restart: unless-stopped
    networks:
      - smarthome-network

  
  temperature-api:
    build:
      context: ./temperature_api
      dockerfile: Dockerfile
    container_name: temperature_api 
    environment:
      ASPNETCORE_HTTP_PORTS: 8081
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network
      
  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://smartuser:smartpass@smarthome-postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_vol:

networks:
  smarthome-network:
    driver: bridge